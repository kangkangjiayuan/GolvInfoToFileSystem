<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能瞭望 - 登录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .login-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            max-width: 900px;
            width: 100%;
            backdrop-filter: blur(10px);
        }
        .login-left {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .login-left h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
            font-weight: 300;
        }
        .login-left p {
            font-size: 1.1em;
            opacity: 0.9;
            line-height: 1.6;
        }
        .login-right {
            padding: 60px 40px;
            background: white;
        }
        .login-right h2 {
            color: #333;
            margin-bottom: 30px;
            font-weight: 300;
            text-align: center;
        }
        .form-control {
            border: none;
            border-bottom: 2px solid #e1e8ff;
            border-radius: 0;
            padding: 15px 0;
            font-size: 1.1em;
            transition: all 0.3s ease;
            background: transparent;
        }
        .form-control:focus {
            border-bottom-color: #667eea;
            box-shadow: none;
            background: transparent;
        }
        .form-control::placeholder {
            color: #999;
        }
        .input-group-text {
            background: transparent;
            border: none;
            border-bottom: 2px solid #e1e8ff;
            border-radius: 0;
            color: #667eea;
        }
        .btn-login {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-size: 1.1em;
            font-weight: 500;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 20px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        .alert {
            border-radius: 10px;
            border: none;
            margin-bottom: 20px;
        }
        .logo-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.9;
        }
        .feature-list {
            margin-top: 30px;
            text-align: left;
        }
        .feature-list li {
            margin-bottom: 15px;
            font-size: 1em;
            opacity: 0.9;
        }
        .feature-list i {
            margin-right: 10px;
            color: #fff;
        }
        @media (max-width: 768px) {
            .login-container {
                margin: 20px;
                border-radius: 15px;
            }
            .login-left, .login-right {
                padding: 40px 30px;
            }
            .login-left h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="row g-0">
            <div class="col-md-6">
                <div class="login-left">
                    <div class="logo-icon">
                        <i class="fas fa-brain"></i>
                    </div>
                    <h1>智能瞭望</h1>
                    <p>让数据分析更简单、更智能</p>
                    <ul class="feature-list">
                        <li><i class="fas fa-search"></i> 智能数据采集</li>
                        <li><i class="fas fa-chart-line"></i> 数据分析处理</li>
                        <li><i class="fas fa-file-pdf"></i> 报告自动生成</li>
                        <li><i class="fas fa-shield-alt"></i> 数据安全保障</li>
                    </ul>
                </div>
            </div>
            <div class="col-md-6">
                <div class="login-right">
                    <h2><i class="fas fa-sign-in-alt"></i> 用户登录</h2>
                    
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show">
                                    <i class="fas fa-{{ 'exclamation-triangle' if category == 'error' else 'info-circle' }}"></i>
                                    {{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    
                    <form method="POST">
                        <div class="mb-4">
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-user"></i></span>
                                <input type="text" class="form-control" name="username" placeholder="用户名" required>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <div class="input-group">
                                <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                <input type="password" class="form-control" name="password" placeholder="密码" required>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-login">
                            <i class="fas fa-sign-in-alt"></i> 登录
                        </button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="text-muted">默认管理员账号: admin / admin888</p>
                        <a href="{{ url_for('auth.register') }}" class="text-decoration-none">
                            <i class="fas fa-user-plus"></i> 注册新账号
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
